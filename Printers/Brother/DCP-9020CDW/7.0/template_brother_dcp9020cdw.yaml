        name: 'Interface #{#SNMPINDEX} ({#IFDESCR}): Outgoing packets (pps)'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.17.{#SNMPINDEX}
        key: brother.net.if.packets.out[{#SNMPINDEX}]
        delay: 1m
