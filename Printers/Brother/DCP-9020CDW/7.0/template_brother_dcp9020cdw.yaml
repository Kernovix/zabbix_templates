    - uuid: cca3d79fb22a4d8a86ab76e0e2e4d668
      name: Black toner - nivel privado (%)
      type: DEPENDENT
      key: brother.toner.pct[black]
      history: 30d
      value_type: FLOAT
      trends: 365d
      units: '%'
      description: Brother private TLV field decoding 0x81; validate percentage against the printer panel.
      master_item:
        key: brother.maintenance.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var s=String(value);var b=[];\nif (/^(?:\\s*[0-9A-Fa-f]{2}\\s*)+$/.test(s)) {\n var h=s.match(/[0-9A-Fa-f]{2}/g);for(var\
          \ z=0;z<h.length;z++) b.push(parseInt(h[z],16));\n} else if (/^Hex-STRING:/i.test(s)) {\n var a=s.slice(11).match(/[0-9A-Fa-f]{2}/g)||[];for(var\
          \ z=0;z<a.length;z++)b.push(parseInt(a[z],16));\n} else {for(var z=0;z<s.length;z++)b.push(s.charCodeAt(z)&255);}\n\
          for(var i=0;i+6<b.length;i++){\n if(b[i]===0x81 && b[i+1]===1 && b[i+2]===4){\n var v=(((b[i+3]*256+b[i+4])*256+b[i+5])*256+b[i+6]);\n\
          \ if(v>=0&&v<=100)return v;\n }\n}\nthrow 'O bloco Brother not contem percentagem valida para 81';"
        error_handler: DISCARD_VALUE
