    - uuid: 843a555dcc6b41e594a11c506e69fe11
      name: Erros da impressora - bits descodificados HR-MIB
      type: DEPENDENT
      key: brother.printer.error.flags
      master_item:
        key: brother.printer.errors
      delay: '0'
      history: 30d
      trends: 365d
      description: Bit N indicates condition N da hrPrinterDetectedErrorState (RFC 2790), processada a partir de OCTET
        STRING. 0 indica nenhuma condicao. Confirmar valores em Zabbix Latest Data.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var s=String(value), b=[];\nif (/^\\s*(?:Hex-STRING\\s*:\\s*)/i.test(s)) {\n s=s.replace(/^\\s*Hex-STRING\\\
          s*:\\s*/i, '');\n}\nif (/^\\s*0x(?:[0-9a-f]{2})+\\s*$/i.test(s)) s=s.trim().slice(2);\nif (/^\\s*(?:[0-9a-f]{2}\\\
          s*)+$/i.test(s) && s.trim()!=='') {\n var hex=s.match(/[0-9a-f]{2}/gi)||[];\n for (var i=0;i<hex.length;i++)b.push(parseInt(hex[i],16));\n\
          } else {\n for (var j=0;j<s.length;j++)b.push(s.charCodeAt(j)&255);\n}\nif (b.length===0) return 0;\n\
          var v=0;\nfor (var byteIndex=0;byteIndex<Math.min(2,b.length);byteIndex++){\n for (var bit=0;bit<8;bit++)\
          \ {\n  if ((b[byteIndex] & (128>>bit))!==0) v+=(1<<(byteIndex*8+bit));\n }\n}\nreturn v;"
