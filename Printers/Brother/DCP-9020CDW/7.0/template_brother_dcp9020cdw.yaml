      trigger_prototypes:
      - uuid: 25c6d47b77254c40af261f019589c0ff
        name: 'Interface #{#SNMPINDEX} ({#IFDESCR}): link down (opt-in)'
        expression: '{$BROTHER.IF.LINK.ALERT}=1 and last(/Brother DCP-9020CDW by SNMP/brother.net.if.admin[{#SNMPINDEX}])=1
          and min(/Brother DCP-9020CDW by SNMP/brother.net.if.oper[{#SNMPINDEX}],5m)=2'
        priority: WARNING
        description: Opcional, ativado pela macro {$BROTHER.IF.LINK.ALERT}=1 apenas quando utilizador decidir monitorizar
          actively monitor this interface. No estado atual idx2 e idx3 estao disabled por configuration. Atenção que
          a total Wi-Fi failure can prevent SNMP access; also use ICMP.
      - uuid: d1129ef80b554d429e994b16080e2fbd
