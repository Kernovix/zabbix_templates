        expression: avg(/Brother DCP-9020CDW by SNMP/brother.net.if.in.err[{#SNMPINDEX}],10m)>{$BROTHER.IF.ERROR.RATE}
          or avg(/Brother DCP-9020CDW by SNMP/brother.net.if.out.err[{#SNMPINDEX}],10m)>{$BROTHER.IF.ERROR.RATE}
