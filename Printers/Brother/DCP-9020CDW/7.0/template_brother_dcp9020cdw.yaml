    recovery_expression: (last(/Brother DCP-9020CDW by SNMP/brother.toner.pct[yellow])>{$BROTHER.WARN.RECOVERY}
      or last(/Brother DCP-9020CDW by SNMP/brother.toner.pct[yellow])<{$BROTHER.CRIT})
    tags:
    - tag: component
      value: supplies
  - uuid: f51fae3474824235ab7ee37c4bac0133
    expression: max(/Brother DCP-9020CDW by SNMP/icmpping,5m)=0
    name: 'Brother: Printer unreachable for 5 minutes'
    priority: HIGH
    tags:
    - tag: component
      value: printer
  - uuid: aea676c1a68546f488a777e559a2fec5
    expression: min(/Brother DCP-9020CDW by SNMP/zabbix[host,snmp,available],10m)=0
    name: 'Brother: SNMP unavailable for 10 minutes'
    priority: WARNING
    tags:
    - tag: component
      value: network
  - uuid: c4392cade95d4e9db93fead0563d8452
    expression: last(/Brother DCP-9020CDW by SNMP/brother.device.status)=5
    name: 'Brother: Internal device failure'
    priority: AVERAGE
    description: hrDeviceStatus = down. Sem alarme durante standby (running = 2).
    tags:
    - tag: component
      value: printer
  - uuid: 27d6a8302bb246a192a932eca28bdffb
    expression: last(/Brother DCP-9020CDW by SNMP/brother.device.status)=3
    name: 'Brother: Internal device warning'
    priority: AVERAGE
    description: hrDeviceStatus warning; verificar papel/tampa pela descricao
    tags:
    - tag: component
      value: printer
  - uuid: 9a8d1495e09241eb89065bc5dc2e5b33
    name: 'Brother: ICMP packet loss above 20% (5m)'
    expression: min(/Brother DCP-9020CDW by SNMP/icmppingloss,5m)>{$BROTHER.PING.LOSS.WARN}
    priority: WARNING
    description: Zabbix tem de conseguir pingar a impressora. O estado de sleep pode influenciar a resposta ICMP.
    tags:
    - tag: component
      value: network
  - uuid: 1a577a03ccaf4475b7403b5d597899d2
    name: 'Brother: High ICMP latency (5m)'
    expression: min(/Brother DCP-9020CDW by SNMP/icmppingsec,5m)>{$BROTHER.PING.RTT.WARN}
    priority: INFO
    description: Limite de 150 ms por defeito, ajustar para LAN/WLAN e comportamento em sleep.
    tags:
    - tag: component
      value: network
  - uuid: 5464ed42f0384ed7a9742fdb8f9a0175
    expression: (last(/Brother DCP-9020CDW by SNMP/brother.alert.code)=8 or bitand(last(/Brother DCP-9020CDW by
      SNMP/brother.printer.error.flags),32)<>0)
    name: 'Brother: Paper jam'
    priority: AVERAGE
    description: prtAlertCode=8 (jam) ou hrPrinterDetectedErrorState bit 5 (jammed).
    tags:
    - tag: component
      value: printer
  - uuid: 9fd73dd085694d42a6086561d2d3cc07
    expression: (last(/Brother DCP-9020CDW by SNMP/brother.alert.code)=808 or bitand(last(/Brother DCP-9020CDW by
      SNMP/brother.printer.error.flags),2)<>0 or bitand(last(/Brother DCP-9020CDW by SNMP/brother.printer.error.flags),8192)<>0)
    name: 'Brother: Paper tray empty'
    priority: AVERAGE
    description: prtAlertCode=808 (inputMediaSupplyEmpty), bit 1 (noPaper) ou 13 (inputTrayEmpty). Um nivel -3 not
      significa bandeja vazia.
    tags:
    - tag: component
      value: printer
  - uuid: 0f3b2fdbd7df4a0294a29e7873b1b52f
    expression: (last(/Brother DCP-9020CDW by SNMP/brother.alert.code)=3 or last(/Brother DCP-9020CDW by SNMP/brother.alert.code)=501
      or bitand(last(/Brother DCP-9020CDW by SNMP/brother.printer.error.flags),16)<>0)
    name: 'Brother: Cover or door open'
    priority: AVERAGE
    description: prtAlertCode=3/501 ou hrPrinterDetectedErrorState bit 4 (doorOpen).
    tags:
    - tag: component
      value: printer
  - uuid: e27939e1f144438e831405a74bdfd79d
    expression: (bitand(last(/Brother DCP-9020CDW by SNMP/brother.printer.error.flags),128)<>0 or last(/Brother
      DCP-9020CDW by SNMP/brother.alert.code)=29 or last(/Brother DCP-9020CDW by SNMP/brother.alert.code)=30)
    name: 'Brother: Service required'
    priority: AVERAGE
    description: Bit HR serviceRequested ou Printer-MIB alerta de avaria de subunidade.
    tags:
    - tag: component
      value: printer
