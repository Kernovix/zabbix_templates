      snmp_oid: discovery[{#SUPPLYNAME},1.3.6.1.2.1.43.11.1.1.6.1]
      key: brother.supplies.discovery
      delay: 6h
      item_prototypes:
      - uuid: dd53cbe5d902443488f45bec577b1b81
        name: 'Supply {#SUPPLYNAME}: raw level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}
        key: brother.supply.discovered.level[{#SNMPINDEX}]
        delay: 15m
        history: 7d
        trends: 90d
        value_type: FLOAT
        description: Valor bruto. Negativos indicam niveis indeterminados; not aplicar limiares percentuais.
      - uuid: 28eba8e1fcfa4305b829beba0cd8cc52
        name: 'Supply {#SUPPLYNAME}: capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.{#SNMPINDEX}
        key: brother.supply.discovered.capacity[{#SNMPINDEX}]
        delay: 1h
        history: 7d
        trends: 90d
        value_type: FLOAT
    - uuid: b28ee9bc260f4a41af2fcdbcf75e20f5
      name: Descoberta das network interfaces (IF-MIB, indices 1-4)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2]
      key: brother.net.interfaces.discovery
      delay: 1h
      description: ifDescr/index sao confirmados. idx1 Wi-Fi provavel (72Mbps, ativo), idx2 Ethernet provavel (100Mbps,
        administrativamente down), idx3 Wi-Fi secundaria (down), idx4 loopback. ifType=7 nas 3 interfaces fisicas;
        not usar ifType para discriminar Wi-Fi. Consultar Latest data.
      item_prototypes:
      - uuid: 8bc42fd163c9470b9d745d002d9c79e5
        name: 'Interface #{#SNMPINDEX} ({#IFDESCR}): Tipo (IANA ifType)'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}
        key: brother.net.if.type[{#SNMPINDEX}]
        delay: 1h
        history: 14d
        trends: 365d
        description: 'IF-MIB ifType: Brother devolveu 7 nas interfaces 1,2,3; esse valor not identifica de forma
          reliably distinguish the physical network medium on this printer.'
      - uuid: 4028ef0aec494f37b0eea64cbaf5e205
        name: 'Interface #{#SNMPINDEX} ({#IFDESCR}): Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: brother.net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        description: 1 up, 2 down, 3 testing
        valuemap:
          name: Brother IF-MIB admin state
      - uuid: 438d476ab19b4f8399129e8e58dcafcb
        name: 'Interface #{#SNMPINDEX} ({#IFDESCR}): Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: brother.net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        description: 1=up, 2=down. Em idx1 ativo, idx2/3 administrativamente disabled, idx4 loopback. Do not alarme
          on idx2/3 without reconfiguring the printer.
        valuemap:
          name: Brother IF-MIB state
      - uuid: 4716bf7d09fe4f33a84e4b73c7857aa8
        name: 'Interface #{#SNMPINDEX} ({#IFDESCR}): Reported interface speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.5.{#SNMPINDEX}
        key: brother.net.if.speed[{#SNMPINDEX}]
        delay: 30m
        history: 14d
        trends: 365d
        units: bps
        description: 'Velocidade IF-MIB ifSpeed: 72 Mbps em idx1/idx3, 100 Mbps em idx2, 0 em loopback. Valor reportado,
          NAO throughput real nem velocidade de Internet.'
      - uuid: f56eff1331534dd693e720645a7dc8e2
        name: 'Interface #{#SNMPINDEX} ({#IFDESCR}): MAC address'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.6.{#SNMPINDEX}
        key: brother.net.if.mac[{#SNMPINDEX}]
        delay: 1h
